services:
  db:
    image: postgres:17-alpine
    container_name: world-cup-2026-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: world_cup_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world_cup_2026"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
